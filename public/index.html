<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Login Test</title>
</head>
<body>
  <h1>Test Google Login</h1>
  <button id="login">Login with Google</button>
  <div id="msg"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://lgyqhhzoznenxtxzdate.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY'; // replace with your anon key
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginButton = document.getElementById('login');
    const msg = document.getElementById('msg');

    loginButton.addEventListener('click', async () => {
      try {
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin } // must match Google Cloud URI
        });
        if (error) {
          msg.textContent = 'Login error: ' + error.message;
          console.error(error);
        }
      } catch (err) {
        msg.textContent = 'Unexpected error: ' + err.message;
        console.error(err);
      }
    });

    // check session on load
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        msg.textContent = 'Already logged in';
        console.log(session);
      }
    });
  </script>
</body>
</html>
